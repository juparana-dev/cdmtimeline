    <path d="M 650.514539 107.896221 A 420 420 0 0 1 914.829103 565.702475 L 840.752478 553.969890 A 345 345 0 0 0 623.636943 177.914753 Z" transform="rotate(240 500 500)"/>
    <circle cx="500" cy="120" r="100"/>
    <circle cx="829.089" cy="690" r="100"/>
    <circle cx="170.911" cy="690" r="100"/>
  </g>
  <g data-loader-layer="database" transform="translate(0 -60)">
    <path fill="#eeb41e" d="M 500 375 C 589.89 375 662.75 407.91 662.75 448.5 C 662.75 489.09 589.89 522 500 522 C 410.11 522 337.25 489.09 337.25 448.5 C 337.25 407.91 410.11 375 500 375 Z"/>
    <path fill="#eeb41e" d="M 337.25 497.5 C 373 532 431 549 500 549 C 569 549 627 532 662.75 497.5 L 662.75 568 C 662.75 601.5 589.89 636 500 636 C 410.11 636 337.25 601.5 337.25 568 Z"/>
    <path fill="#eeb41e" d="M 337.25 610.25 C 373 645 431 665.5 500 665.5 C 569 665.5 627 645 662.75 610.25 L 662.75 676 C 662.75 706.5 589.89 744.75 500 744.75 C 410.11 744.75 337.25 706.5 337.25 676 Z"/>
  </g>
</svg>