<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" shape-rendering="geometricPrecision" data-asset-role="functional-loader">
  <style>
    @keyframes cdmStructureIn {
      0% { opacity: 0; transform: translateY(3px) scale(.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cdmDatabaseIn {
      0% { opacity: 0; transform: scale(.94); }
      62%, 100% { opacity: 1; transform: scale(1); }
    }
    [data-loader-layer="structure"] {
      transform-box: fill-box;
      transform-origin: center;
      animation: cdmStructureIn 560ms cubic-bezier(.22,1,.36,1) both;
    }
    [data-loader-layer="database"] {
      transform-box: fill-box;
      transform-origin: center;
      animation: cdmDatabaseIn 760ms 140ms cubic-bezier(.22,1,.36,1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      [data-loader-layer] { animation: none !important; opacity: 1; }
    }
  </style>
  <g data-loader-layer="structure" fill="#45813c">
    <path d="M 650.514539 107.896221 A 420 420 0 0 1 914.829103 565.702475 L 840.752478 553.969890 A 345 345 0 0 0 623.636943 177.914753 Z"/>
