<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CDM | Apresentação</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff}body{display:grid;place-items:center;font-family:Arial,sans-serif;color:#45813c}.boot-error{max-width:680px;padding:32px;text-align:center;font-size:16px;line-height:1.5}</style>
</head>
<body>
<script>
(async function boot(){
  try {
    if (typeof DecompressionStream !== 'function') throw new Error('Navegador incompatível com a apresentação.');
    var response = await fetch('presentation.bin');
    if (!response.ok) throw new Error('Falha ao carregar a apresentação: ' + response.status);
    var html = await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.body.innerHTML = '<div class="boot-error">Não foi possível iniciar a apresentação do CDM. Atualize esta página em um navegador moderno.</div>';
  }
})();
</script>
</body>
</html>
